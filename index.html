<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Season Points Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="scripts.js" defer></script>
  </head>
  <body>
    <header class="calculator-wrapper">
      <h1 class="calculator-title">F1 Season Points Calculator</h1>
      <p class="calculator-description">
        Enter the driver's finishing position for each race (1-10 for points,
        leave empty or use >10 for 0 points).
      </p>
    </header>
    <main>
      <form class="form-wrapper">
        <div id="inputs-wrapper"></div>
        <button class="submit-btn" type="submit">Submit</button>
      </form>
    </main>
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <p id="modal-text"></p>
        <span id="close-modal-btn" class="close">&times;</span>
      </div>
    </div>
  </body>
</html>
